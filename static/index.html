<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>София — SOAR + LLM</title>
<style>
  :root {
    --bg: #0a0e1a;
    --panel: #121a2e;
    --accent: #38e8ff;
    --accent-dim: #1c6b7a;
    --user: #1e3a5f;
    --sofia: #16233d;
    --text: #e6edf7;
    --muted: #7d8aa3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Segoe UI", system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column;
    transition: background 0.8s ease;
  }
  header {
    padding: 12px 16px; border-bottom: 1px solid var(--accent-dim);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; letter-spacing: 1px; }
  header h1 .dot {
    display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent); margin-right: 8px;
    box-shadow: 0 0 10px var(--accent);
  }
  .badge {
    font-size: 12px; padding: 3px 10px; border-radius: 12px;
    background: var(--panel); color: var(--muted);
    border: 1px solid var(--accent-dim);
  }
  #emotion { color: var(--accent); }
  #chat {
    flex: 1; overflow-y: auto; padding: 16px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .msg {
    max-width: 78%; padding: 10px 14px; border-radius: 14px;
    line-height: 1.45; white-space: pre-wrap; word-wrap: break-word;
    animation: fade 0.2s ease;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  .msg.user {
    align-self: flex-end; background: var(--user);
    border-bottom-right-radius: 4px;
  }
  .msg.sofia {
    align-self: flex-start; background: var(--sofia);
    border-bottom-left-radius: 4px; border: 1px solid var(--accent-dim);
  }
  .msg .speak {
    cursor: pointer; opacity: 0.6; margin-left: 8px; font-size: 13px;
  }
  .msg .speak:hover { opacity: 1; }
  #thinking {
    align-self: flex-start; color: var(--muted); font-style: italic;
    display: none; padding: 4px 14px;
  }
  #thinking.on { display: block; }
  #thinking::after { content: "▍"; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  footer {
    padding: 12px 16px; border-top: 1px solid var(--accent-dim);
    display: flex; gap: 10px;
  }
  #msg {
    flex: 1; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--accent-dim); background: var(--panel);
    color: var(--text); font-size: 15px; outline: none;
  }
  #msg:focus { border-color: var(--accent); }
  button#send {
    padding: 0 20px; border-radius: 10px; border: none;
    background: var(--accent); color: #002028; font-weight: 600;
    cursor: pointer; font-size: 15px;
  }
  button#send:disabled { opacity: 0.4; cursor: default; }
  @media (max-width: 600px) { .msg { max-width: 90%; } }
</style>
</head>
<body>
<header>
  <h1><span class="dot"></span>СОФИЯ</h1>
  <span class="badge">эмоция: <span id="emotion">нейтрально</span></span>
  <span class="badge" id="status">подключение…</span>
</header>

<div id="chat">
  <div id="thinking">София думает</div>
</div>

<footer>
  <input id="msg" type="text" placeholder="Скажи что-нибудь…" autocomplete="off" disabled>
  <button id="send" disabled>Отправить</button>
</footer>

<script>
const chat = document.getElementById("chat");
const thinking = document.getElementById("thinking");
const input = document.getElementById("msg");
const sendBtn = document.getElementById("send");
const emotionEl = document.getElementById("emotion");
const statusEl = document.getElementById("status");

let ws, current = null, lastText = "";

// Цвет фона по эмоции
const EMOTION_COLORS = {
  "радость": "#0a1a0e", "грусть": "#0a0e1a", "гнев": "#1a0a0a",
  "страх": "#120a1a", "доверие": "#0a1518", "отвращение": "#0f1a0a",
  "удивление": "#1a140a", "ожидание": "#0a0e1a", "нейтрально": "#0a0e1a",
};

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws.binaryType = "arraybuffer";

  ws.onopen = () => {
    statusEl.textContent = "онлайн";
    input.disabled = false; sendBtn.disabled = false; input.focus();
  };
  ws.onclose = () => {
    statusEl.textContent = "отключено";
    input.disabled = true; sendBtn.disabled = true;
    setTimeout(connect, 2000);
  };
  ws.onmessage = onMessage;
}

function onMessage(e) {
  // Бинарное сообщение = аудио
  if (e.data instanceof ArrayBuffer) {
    playAudio(e.data);
    return;
  }
  // JSON-служебные сообщения
  if (e.data.startsWith("{")) {
    try {
      const m = JSON.parse(e.data);
      if (m.type === "meta" && m.emotion) setEmotion(m.emotion);
      else if (m.type === "error") { finishStream(); addMsg("sofia", "⚠ " + m.error); }
      else if (m.type === "replace" && current) current.textNode.textContent = m.text;
      return;
    } catch (_) { /* обычный текст */ }
  }
  if (e.data === "[END]") { finishStream(); return; }
  appendToken(e.data);
}

function setEmotion(emotion) {
  emotionEl.textContent = emotion;
  document.body.style.background = EMOTION_COLORS[emotion] || EMOTION_COLORS["нейтрально"];
}

function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  const span = document.createElement("span");
  span.textContent = text;
  div.appendChild(span);
  if (role === "sofia") {
    const speak = document.createElement("span");
    speak.className = "speak"; speak.textContent = "🔊";
    speak.onclick = () => speakText(span.textContent);
    div.appendChild(speak);
  }
  chat.insertBefore(div, thinking);
  scroll();
  return { div, textNode: span };
}

function appendToken(tok) {
  thinking.classList.remove("on");
  if (!current) current = addMsg("sofia", "");
  current.textNode.textContent += tok;
  lastText = current.textNode.textContent;
  scroll();
}

function finishStream() {
  thinking.classList.remove("on");
  current = null;
}

function send() {
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;
  addMsg("user", text);
  ws.send(text);
  input.value = "";
  thinking.classList.add("on");
  chat.appendChild(thinking);
  scroll();
}

function scroll() { chat.scrollTop = chat.scrollHeight; }

// Воспроизведение аудио от XTTS.
// Сервер шлёт речь по предложениям (несколько фреймов подряд), поэтому
// воспроизводим их по очереди, а не одновременно.
const audioQueue = [];
let audioPlaying = false;

function playAudio(buffer) {
  const blob = new Blob([buffer], { type: "audio/wav" });
  audioQueue.push(URL.createObjectURL(blob));
  if (!audioPlaying) playNextAudio();
}

function playNextAudio() {
  if (audioQueue.length === 0) { audioPlaying = false; return; }
  audioPlaying = true;
  const url = audioQueue.shift();
  const audio = new Audio(url);
  const done = () => { URL.revokeObjectURL(url); playNextAudio(); };
  audio.onended = done;
  audio.onerror = done;
  audio.play().catch(done);
}

// Повторная озвучка — браузерный TTS (fallback, если нет серверного аудио)
function speakText(text) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "ru-RU";
  speechSynthesis.speak(u);
}

sendBtn.onclick = send;
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});

connect();
</script>
</body>
</html>
